// AnimatedElement.tsx
const AnimatedElement = ({ children, className = '', style, ...props }) => {
    const [isVisible, setIsVisible] = useState(false);
    const ref = useRef(null);

    useEffect(() => {
        const observer = new IntersectionObserver(
            ([entry]) => {
                if (entry.isIntersecting) {
                    setIsVisible(true);
                    if(ref.current) {
                      observer.unobserve(ref.current);
                    }
                }
            },
            {
                threshold: 0.1,
            }
        );

        if (ref.current) {
            observer.observe(ref.current);
        }

        return () => {
            if (ref.current) {
                observer.unobserve(ref.current);
            }
        };
    }, []);

    return (
        <div
            ref={ref}
            className={`${className} transition-all duration-1000 ease-out ${
                isVisible ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-10'
            }`}
            style={style}
            {...props}
        >
            {children}
        </div>
    );
};

const NAV_LINKS = [

const Header = () => {
    const [isOpen, setIsOpen] = useState(false);
    const [activeSection, setActiveSection] = useState('home');
    const [isScrolled, setIsScrolled] = useState(false);

    useEffect(() => {
        const handleScroll = () => {
            setIsScrolled(window.scrollY > 20);

            const sections = NAV_LINKS.map(link => document.getElementById(link.href.substring(1)));
            const scrollPosition = window.scrollY + 150;

            for (let i = sections.length - 1; i >= 0; i--) {
                const section = sections[i];
                if (section && section.offsetTop <= scrollPosition) {
                    setActiveSection(section.id);
                    break;
                }
            }
        };

        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
    }, []);

    const navLinkClasses = (href) => 
        `relative font-medium transition-colors duration-300 after:content-[''] after:absolute after:left-0 after:bottom-[-5px] after:h-[3px] after:bg-cyan-400 after:transition-all after:duration-300 after:ease-in-out ${
            activeSection === href.substring(1) ? 'text-cyan-400 after:w-full' : 'text-gray-200 hover:text-cyan-400 after:w-0 hover:after:w-full'
        }`;

    return (
        <header className={`fixed top-0 left-0 w-full z-50 transition-all duration-300 ${isScrolled ? 'bg-black/70 backdrop-blur-sm shadow-lg' : 'bg-transparent'}`}>
            <div className="container mx-auto px-4 sm:px-6 lg:px-8">

                    <div className="text-3xl font-bold text-cyan-400">

                    </div>
                    <div className="hidden md:flex space-x-8">
                        {NAV_LINKS.map(link => (
                            <a key={link.name} href={link.href} className={navLinkClasses(link.href)}>
                                {link.name}
                            </a>
                        ))}
                    </div>
                    <div className="md:hidden">
                        <button onClick={() => setIsOpen(!isOpen)} className="text-gray-200 focus:outline-none">
                            <i className={`fas ${isOpen ? 'fa-times' : 'fa-bars'} text-2xl`}></i>
                        </button>
                    </div>
                </nav>
            </div>
            <div className={`md:hidden transition-all duration-300 ease-in-out ${isOpen ? 'max-h-screen opacity-100' : 'max-h-0 opacity-0'} overflow-hidden bg-black/80 backdrop-blur-sm`}>
                <div className="flex flex-col items-center space-y-4 py-4">
                    {NAV_LINKS.map(link => (
                        <a key={link.name} href={link.href} onClick={() => setIsOpen(false)} className={`${navLinkClasses(link.href)} text-lg`}>
                            {link.name}
                        </a>
                    ))}
                </div>
            </div>
        </header>
    );
};

// HeroSection.tsx
const ROLES = ['Frontend Developer', 'UI/UX Enthusiast', 'Creative Coder'];

const HeroSection = () => {
    const [roleIndex, setRoleIndex] = useState(0);
    const [displayedRole, setDisplayedRole] = useState('');
    const [isDeleting, setIsDeleting] = useState(false);

    useEffect(() => {
        const handleTyping = () => {
            const currentRole = ROLES[roleIndex];
            if (isDeleting) {
                setDisplayedRole(currentRole.substring(0, displayedRole.length - 1));
            } else {
                setDisplayedRole(currentRole.substring(0, displayedRole.length + 1));
            }

            if (!isDeleting && displayedRole === currentRole) {
                setTimeout(() => setIsDeleting(true), 2000);
            } else if (isDeleting && displayedRole === '') {
                setIsDeleting(false);
                setRoleIndex((prevIndex) => (prevIndex + 1) % ROLES.length);
            }

const ContactSection = () => {
    const [formData, setFormData] = useState({
        fullName: '',
        email: '',
        subject: '',
        message: '',
    });

    const handleChange = (e) => {
        const { name, value } = e.target;
        setFormData(prev => ({ ...prev, [name]: value }));
    };

    const handleSubmit = (e) => {
        e.preventDefault();
        console.log('Form Submitted:', formData);
        alert('Thank you for your message!');
        setFormData({ fullName: '', email: '', subject: '', message: '' });
    };

    return (
        <section id="contact" className="py-20 lg:py-32 bg-[#1a1a1a]">
            <div className="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <AnimatedElement>
                    <h2 className="text-4xl lg:text-5xl font-bold mb-12 relative inline-block">
                        Contact Me!
                        <span className="absolute -bottom-2 left-1/2 -translate-x-1/2 w-1/2 h-1 bg-cyan-400 rounded-full"></span>
                    </h2>
                </AnimatedElement>
                <AnimatedElement className="max-w-3xl mx-auto mt-8">
                    <form onSubmit={handleSubmit} className="bg-[#2a2a2a] p-8 rounded-lg shadow-xl space-y-6">
                        <div className="flex flex-col md:flex-row gap-6">
                            <input type="text" name="fullName" placeholder="Full Name" value={formData.fullName} onChange={handleChange} className="form-input" required />
                            <input type="email" name="email" placeholder="Email Address" value={formData.email} onChange={handleChange} className="form-input" required />
                        </div>
                        <input type="text" name="subject" placeholder="Subject" value={formData.subject} onChange={handleChange} className="form-input" required />
                        <textarea name="message" placeholder="Your Message" value={formData.message} onChange={handleChange} className="form-input min-h-[150px] resize-y" required></textarea>
                        <button type="submit" className="btn-primary w-full">Send Message</button>
                    </form>
                </AnimatedElement>
            </div>
        </section>
    );
};

// Footer.tsx
const Footer = () => {
    return (
        <footer className="bg-black py-6 border-t border-gray-800">
            <div className="container mx-auto px-4 sm:px-6 lg:px-8 text-center">
                <p className="text-gray-500">Copyright &copy; {new Date().getFullYear()} By Thai Tuan. All Rights Reserved.</p>
            </div>
        </footer>
    );
};

// App.tsx
const App = () => {
    return (
        <div className="min-h-screen">
            <Header />
            <main>
                <HeroSection />
                <AboutSection />
                <ServicesSection />
                <PortfolioSection />
                <ContactSection />
            </main>
            <Footer />
        </div>
    );
};

const rootElement = document.getElementById('root');
if (!rootElement) {
  throw new Error("Could not find root element to mount to");
}

const root = ReactDOM.createRoot(rootElement);
root.render(
  <React.StrictMode>
    <App />

);

</script>
